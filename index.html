<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>A4 Portrait Document</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="document">
      <div class="header">
        <div>
          <p>
            <span data-personal="first-name"></span><br />
            <span data-personal="last-name"></span>
          </p>
        </div>
        <div class="qr-code">
          <img alt="qr" src="./assets/qr-jordiperalta-cv.svg" />
        </div>
      </div>
      <div class="content">
        <div class="history">
          <div class="history-header">
            <div class="history-header-section header-experience">
              <i data-lucide="pickaxe" aria-hidden="true"></i>
              <span>Experience</span>
            </div>
            <div class="history-header-section header-education">
              <span>Education</span>
              <i data-lucide="graduation-cap" aria-hidden="true"></i>
            </div>
          </div>
          <div class="history-main">
            <div class="history-main-left">
              <div class="experience-timeline" aria-label="Professional experience timeline"></div>
              <div class="experience-details"></div>
            </div>
            <div class="history-main-centre"></div>
            <div class="history-main-right">
              <div class="education-timeline" aria-label="Education timeline"></div>
              <div class="education-details"></div>
            </div>
          </div>
        </div>
        <div class="experience"></div>
      </div>
      <div class="location">
        <div>
          <span>
            <span data-personal="city"></span> <br />
            <span data-personal="code"></span>, <span data-personal="country"></span>
          </span>
          <!-- <i class="fa-solid fa-home contact-icon" aria-hidden="true"></i> -->
          <i data-lucide="map-pin-house" class="contact-icon" aria-hidden="true"></i>
        </div>
      </div>
      <div class="contact">
        <div>
          <span>
            <a data-personal-link="email"></a>
          </span>
          <i class="fa-solid fa-envelope contact-icon" aria-hidden="true"></i>
        </div>
        <div>
          <span>
            <a data-personal-link="linkedin"></a>
          </span>
          <i class="fa-brands fa-linkedin contact-icon" aria-hidden="true"></i>
        </div>
        <div>
          <span>
            <a data-personal-link="website" target="_blank" rel="noopener noreferrer"></a>
          </span>
          <i class="fa-solid fa-earth-americas contact-icon" aria-hidden="true"></i>
        </div>
        <div>
          <span>
            <a data-personal-link="docker" target="_blank" rel="noopener noreferrer"></a>
          </span>
          <i class="fa-brands fa-docker contact-icon" aria-hidden="true"></i>
        </div>
      </div>
    </main>
    <button class="print-button" type="button" onclick="window.print()">
      Save as PDF
    </button>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="data/experience.js"></script>
    <script src="data/education.js"></script>
    <script src="data/personal.js"></script>
    <script src="script.js"></script>
    <script>
      lucide.createIcons();
    </script>
  </body>
</html>
